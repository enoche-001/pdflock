<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Photo to PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--txt:#eef0f4;--mut:#9aa1ae;--acc:#4f8cff;--ok:#22c55e;--bad:#ef4444;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  body{padding:14px 14px calc(96px + var(--sb));max-width:760px;margin:0 auto}
  h1{font-size:19px;margin:2px 0 12px}
  button,.btn{font:inherit;font-size:15px;font-weight:600;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 10px;cursor:pointer;text-align:center;display:block;width:100%;touch-action:manipulation}
  button:active,.btn:active{transform:scale(.98)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.ok{background:var(--ok);border-color:var(--ok);color:#052e14}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.4}
  input[type=file]{display:none}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions .wide{grid-column:1/-1}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .opts label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
  .opts .full{grid-column:1/-1}
  select,input[type=text]{font:inherit;font-size:16px;width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px}
  #grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:560px){#grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:760px){#grid{grid-template-columns:repeat(4,1fr)}}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
  .thumb{aspect-ratio:3/4;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .thumb img{max-width:100%;max-height:100%;display:block}
  .num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.72);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
  .tools{display:grid;grid-template-columns:repeat(4,1fr)}
  .tools button{border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0;font-size:16px;background:transparent}
  .empty{color:var(--mut);text-align:center;padding:36px 12px;border:1px dashed var(--line);border-radius:14px;font-size:14px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + var(--sb));background:rgba(15,17,21,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr;gap:10px;max-width:760px;margin:0 auto}
  #toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%);background:#000c;border:1px solid var(--line);color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;max-width:90%;text-align:center;display:none;z-index:99}

  /* camera */
  #cam{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;height:100dvh}
  #video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
  .camTop{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;justify-content:space-between;padding:calc(10px + var(--st)) 10px 10px;background:linear-gradient(#000a,transparent)}
  .camTop button{width:auto;flex:1;background:#0008;border-color:#fff3;padding:10px 4px;font-size:14px}
  .camTop button.on{background:#facc15;color:#000;border-color:#facc15}
  #expWrap{position:absolute;left:0;right:0;bottom:calc(124px + var(--sb));display:none;align-items:center;gap:10px;padding:0 20px;color:#fff;font-size:13px}
  #expWrap input{flex:1}
  .camBottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 16px calc(16px + var(--sb));background:#000}
  #shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid #fff5;padding:0;box-shadow:0 0 0 3px #000 inset}
  #shutter:disabled{opacity:.5}
  .cnt{font-size:14px;color:#ddd;display:flex;align-items:center;gap:8px}
  #lastThumb{width:44px;height:58px;object-fit:cover;border-radius:6px;border:1px solid #fff4;display:none}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  #doneCam{background:var(--acc);border-color:var(--acc);color:#fff;padding:12px 6px}

  /* editor */
  #sheet{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;height:100dvh}
  #prev{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;padding:6px}
  #prev img{max-width:100%;max-height:100%}
  .ctrl{padding:12px 14px calc(12px + var(--sb));display:flex;flex-direction:column;gap:10px;background:var(--bg);border-top:1px solid var(--line)}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .chips button{padding:10px 2px;font-size:13px}
  .chips button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
  .sl{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
  .sl input{width:100%}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
</style>
</head>
<body>

<h1>📷 Photo → PDF</h1>

<div class="actions">
  <button id="openCam" class="primary wide">Open Camera</button>
  <label class="btn" for="picker">🖼 Gallery</label>
  <input id="picker" type="file" accept="image/*" multiple>
  <label class="btn" for="nativeCam">📱 Phone camera (1 shot)</label>
  <input id="nativeCam" type="file" accept="image/*" capture="environment" multiple>
</div>

<div class="opts">
  <label>Page
    <select id="pageSize">
      <option value="a4">A4</option>
      <option value="letter">Letter</option>
      <option value="fit">Fit to image</option>
    </select>
  </label>
  <label>Margin
    <select id="margin">
      <option value="0">None</option>
      <option value="20" selected>Small</option>
      <option value="40">Big</option>
    </select>
  </label>
  <label>PDF quality
    <select id="quality">
      <option value="0.95" selected>High (best)</option>
      <option value="0.85">Medium</option>
      <option value="0.7">Small file</option>
    </select>
  </label>
  <label>File name
    <input id="fname" type="text" placeholder="optional" autocapitalize="off">
  </label>
</div>

<div id="grid"></div>
<div id="empty" class="empty">No photos yet.<br>Open the camera or pick from your gallery.</div>

<div class="bar">
  <button id="clear">Clear</button>
  <button id="make" class="ok" disabled>Download PDF</button>
</div>

<div id="toast"></div>

<!-- Camera -->
<div id="cam">
  <video id="video" playsinline autoplay muted></video>
  <div id="flash"></div>
  <div class="camTop">
    <button id="closeCam">✕</button>
    <button id="torchBtn">🔦 Light</button>
    <button id="nightBtn">🌙 Night</button>
    <button id="flip">🔄</button>
  </div>
  <div id="expWrap"><span>☀</span><input id="exp" type="range"><span id="expVal"></span></div>
  <div class="camBottom">
    <div class="cnt"><img id="lastThumb" alt=""><span id="camCnt">0 photos</span></div>
    <button id="shutter" aria-label="Capture"></button>
    <button id="doneCam">Done</button>
  </div>
</div>

<!-- Editor -->
<div id="sheet">
  <div id="prev"><img id="prevImg" alt=""></div>
  <div class="ctrl">
    <div class="chips" id="chips">
      <button data-m="original">Original</button>
      <button data-m="auto">Auto</button>
      <button data-m="night">Night fix</button>
      <button data-m="doc">Document</button>
    </div>
    <div class="sl"><span>Brightness</span><input id="sBright" type="range" min="-50" max="50" value="0"><span id="vBright">0</span></div>
    <div class="sl"><span>Contrast</span><input id="sCon" type="range" min="-50" max="50" value="0"><span id="vCon">0</span></div>
    <div class="row3">
      <button id="eRot">⟳ Rotate</button>
      <button id="eDel" class="danger">Delete</button>
      <button id="eDone" class="primary">Done</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const STORE_MAX = 2800;   // stored size per photo (long side, px)
  const EXPORT_MAX = 2800;  // PDF image size (long side, px) - plenty for A4 print
  let photos = [], uid = 0;
  let stream = null, facing = 'environment', night = false, torchOn = false, busy = false;

  /* ---------- helpers ---------- */
  let toastT;
  function toast(t, ms){
    const e = $('toast'); e.textContent = t; e.style.display = 'block';
    clearTimeout(toastT); toastT = setTimeout(() => e.style.display = 'none', ms || 2600);
  }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const dims = i => [i.videoWidth || i.naturalWidth || i.width, i.videoHeight || i.naturalHeight || i.height];
  function loadImg(src){
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  }
  async function fileToImage(file){
    if (window.createImageBitmap){
      try { return await createImageBitmap(file, {imageOrientation: 'from-image'}); } catch(e){}
    }
    const url = URL.createObjectURL(file);
    try { return await loadImg(url); } finally { URL.revokeObjectURL(url); }
  }
  function downscaleURL(img, maxSide, q){
    const [iw, ih] = dims(img);
    const s = Math.min(1, maxSide / Math.max(iw, ih));
    const c = document.createElement('canvas');
    c.width = Math.round(iw * s); c.height = Math.round(ih * s);
    const x = c.getContext('2d');
    x.imageSmoothingQuality = 'high';
    x.drawImage(img, 0, 0, c.width, c.height);
    const u = c.toDataURL('image/jpeg', q);
    c.width = c.height = 0;
    return u;
  }

  /* ---------- image processing ---------- */
  // p: {rot, mode, bright, contrast}. Returns a canvas.
  function processImg(p, img, maxSide){
    const [iw, ih] = dims(img);
    const sw = p.rot % 180 !== 0;
    const ow = sw ? ih : iw, oh = sw ? iw : ih;
    const s = Math.min(1, maxSide / Math.max(ow, oh));
    const w = Math.round(ow * s), h = Math.round(oh * s);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d', {willReadFrequently: true});
    x.imageSmoothingQuality = 'high';
    x.translate(w / 2, h / 2);
    x.rotate(p.rot * Math.PI / 180);
    const dw = Math.round(iw * s), dh = Math.round(ih * s);
    x.drawImage(img, -dw / 2, -dh / 2, dw, dh);

    if (p.mode === 'original' && !p.bright && !p.contrast) return c;

    const d = x.getImageData(0, 0, w, h), a = d.data, n = w * h;
    if (p.mode === 'doc'){
      for (let i = 0; i < a.length; i += 4){
        const g = 0.299 * a[i] + 0.587 * a[i+1] + 0.114 * a[i+2];
        a[i] = a[i+1] = a[i+2] = g;
      }
    }
    const hist = new Uint32Array(256);
    for (let i = 0; i < a.length; i += 4) hist[(0.299 * a[i] + 0.587 * a[i+1] + 0.114 * a[i+2]) | 0]++;

    let lo = 0, hi = 255, gamma = 1;
    if (p.mode !== 'original'){
      const loP = p.mode === 'doc' ? 0.01 : 0.005;
      const hiP = p.mode === 'doc' ? 0.85 : 0.995;
      let acc = 0;
      for (lo = 0; lo < 255; lo++){ acc += hist[lo]; if (acc >= n * loP) break; }
      acc = 0;
      for (hi = 0; hi < 255; hi++){ acc += hist[hi]; if (acc >= n * hiP) break; }
      if (hi - lo < 20){ lo = 0; hi = 255; }
      let m = 0;
      for (let v = 0; v < 256; v++) m += hist[v] * clamp((v - lo) / (hi - lo), 0, 1);
      m = Math.max(m / n, 0.02);
      const g = Math.log(0.45) / Math.log(m);
      if (p.mode === 'night') gamma = clamp(g, 1, 2.6);
      else if (p.mode === 'auto') gamma = clamp(g, 1, 1.5);
    }
    const bAdd = p.bright * 2.55;
    const cc = p.contrast * 2;
    const cf = (259 * (cc + 255)) / (255 * (259 - cc));
    const lut = new Uint8ClampedArray(256);
    for (let v = 0; v < 256; v++){
      let t = clamp((v - lo) / (hi - lo), 0, 1);
      t = Math.pow(t, 1 / gamma) * 255;
      lut[v] = (t - 128) * cf + 128 + bAdd;
    }
    for (let i = 0; i < a.length; i += 4){
      a[i] = lut[a[i]]; a[i+1] = lut[a[i+1]]; a[i+2] = lut[a[i+2]];
    }
    x.putImageData(d, 0, 0);
    return c;
  }
  async function refreshThumb(p, img){
    const own = !img;
    if (own) img = await loadImg(p.url);
    const c = processImg(p, img, 420);
    p.thumb = c.toDataURL('image/jpeg', 0.75);
    c.width = c.height = 0;
  }

  /* ---------- adding photos ---------- */
  const toBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
  async function addImage(img, mode){
    const [iw, ih] = dims(img);
    const s = Math.min(1, STORE_MAX / Math.max(iw, ih));
    const c = document.createElement('canvas');
    c.width = Math.round(iw * s); c.height = Math.round(ih * s);
    const x = c.getContext('2d');
    x.imageSmoothingQuality = 'high';
    x.drawImage(img, 0, 0, c.width, c.height);
    if (img.close) img.close();
    const blob = await toBlob(c, 0.95);
    const p = {id: ++uid, url: URL.createObjectURL(blob), rot: 0, mode: mode || 'original', bright: 0, contrast: 0};
    await refreshThumb(p, c);
    c.width = c.height = 0;
    photos.push(p);
  }
  async function addFiles(files){
    if (!files.length) return;
    for (let k = 0; k < files.length; k++){
      toast('Processing ' + (k + 1) + ' / ' + files.length + '…', 15000);
      await new Promise(r => setTimeout(r, 20)); // let the UI paint
      try { await addImage(await fileToImage(files[k])); }
      catch(e){ toast('Skipped a file that is not an image'); }
    }
    render(); toast(photos.length + ' photo' + (photos.length > 1 ? 's' : '') + ' ready');
  }
  $('picker').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });
  $('nativeCam').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });

  /* ---------- camera ---------- */
  const track = () => stream && stream.getVideoTracks()[0];
  async function startCam(){
    stopStream();
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: {facingMode: {ideal: facing}, width: {ideal: 4096}, height: {ideal: 3072}},
        audio: false
      });
    }catch(e){
      toast('Camera blocked. Allow camera permission (site must be https), or use "Phone camera".', 4500);
      return;
    }
    const v = $('video');
    v.srcObject = stream;
    $('cam').style.display = 'flex';
    torchOn = false; $('torchBtn').classList.remove('on');
    applyNightPreview();
    setupTrackControls();
    updateCount();
  }
  function stopStream(){
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
  function closeCam(){
    stopStream();
    $('cam').style.display = 'none';
    render();
  }
  async function setupTrackControls(){
    const t = track(); if (!t) return;
    const caps = t.getCapabilities ? t.getCapabilities() : {};
    // continuous focus where possible
    try{
      if (caps.focusMode && caps.focusMode.includes('continuous'))
        await t.applyConstraints({advanced: [{focusMode: 'continuous'}]});
    }catch(e){}
    // exposure slider
    const wrap = $('expWrap');
    if (caps.exposureCompensation && caps.exposureCompensation.max > caps.exposureCompensation.min){
      const r = $('exp'), ec = caps.exposureCompensation;
      r.min = ec.min; r.max = ec.max; r.step = ec.step || 0.1; r.value = 0;
      $('expVal').textContent = '0';
      wrap.style.display = 'flex';
    } else wrap.style.display = 'none';
  }
  $('exp').addEventListener('input', async e => {
    const t = track(); if (!t) return;
    $('expVal').textContent = (+e.target.value).toFixed(1);
    try { await t.applyConstraints({advanced: [{exposureCompensation: +e.target.value}]}); } catch(err){}
  });
  $('torchBtn').onclick = async () => {
    const t = track(); if (!t) return;
    const caps = t.getCapabilities ? t.getCapabilities() : {};
    if (!caps.torch){ toast('This phone/browser blocks the flashlight on web. Try Night mode, or "Phone camera".', 4200); return; }
    try{
      torchOn = !torchOn;
      await t.applyConstraints({advanced: [{torch: torchOn}]});
      $('torchBtn').classList.toggle('on', torchOn);
    }catch(e){ torchOn = false; toast('Flashlight not available'); }
  };
  function applyNightPreview(){
    $('video').style.filter = night ? 'brightness(1.8) contrast(1.1)' : 'none';
    $('nightBtn').classList.toggle('on', night);
  }
  $('nightBtn').onclick = () => { night = !night; applyNightPreview(); toast(night ? 'Night mode on: brighter preview + auto fix on capture' : 'Night mode off'); };
  $('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
  $('openCam').onclick = startCam;
  $('closeCam').onclick = closeCam;
  $('doneCam').onclick = closeCam;
  function updateCount(){
    $('camCnt').textContent = photos.length + ' photo' + (photos.length === 1 ? '' : 's');
    const t = $('lastThumb'), last = photos[photos.length - 1];
    if (last){ t.src = last.thumb; t.style.display = 'block'; } else t.style.display = 'none';
  }

  $('shutter').onclick = async () => {
    if (busy || !stream) return;
    busy = true; $('shutter').disabled = true;
    const fl = $('flash'); fl.style.opacity = .8; setTimeout(() => fl.style.opacity = 0, 120);
    try{
      let img = null;
      // Try full-resolution still first (better quality, better low-light)
      if ('ImageCapture' in window){
        try{
          const ic = new ImageCapture(track());
          const blob = await ic.takePhoto();
          img = await fileToImage(blob);
        }catch(e){ img = null; }
      }
      if (!img){
        const v = $('video');
        if (!v.videoWidth) throw new Error('no frame');
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        img = c;
      }
      await addImage(img, night ? 'night' : 'original');
      if (navigator.vibrate) navigator.vibrate(25);
      updateCount();
    }catch(e){ toast('Capture failed, try again'); }
    busy = false; $('shutter').disabled = false;
  };
  window.addEventListener('pagehide', stopStream);
  document.addEventListener('visibilitychange', () => { if (document.hidden && $('cam').style.display === 'flex') closeCam(); });

  /* ---------- list ---------- */
  function render(){
    const g = $('grid'); g.innerHTML = '';
    photos.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML =
        '<span class="num">' + (i + 1) + '</span>' +
        '<div class="thumb" data-a="e" data-i="' + i + '"><img src="' + p.thumb + '" alt=""></div>' +
        '<div class="tools">' +
        '<button data-a="l" data-i="' + i + '">◀</button>' +
        '<button data-a="e" data-i="' + i + '">✎</button>' +
        '<button data-a="x" data-i="' + i + '">✕</button>' +
        '<button data-a="n" data-i="' + i + '">▶</button>' +
        '</div>';
      g.appendChild(d);
    });
    $('empty').style.display = photos.length ? 'none' : 'block';
    $('make').disabled = !photos.length;
    $('make').textContent = photos.length ? 'Download PDF (' + photos.length + ')' : 'Download PDF';
  }
  $('grid').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const i = +b.dataset.i, a = b.dataset.a;
    if (a === 'x') photos.splice(i, 1);
    else if (a === 'l' && i > 0) [photos[i-1], photos[i]] = [photos[i], photos[i-1]];
    else if (a === 'n' && i < photos.length - 1) [photos[i+1], photos[i]] = [photos[i], photos[i+1]];
    else if (a === 'e'){ openEditor(i); return; }
    render();
  });
  $('clear').onclick = () => { if (photos.length && confirm('Remove all photos?')){ photos = []; render(); } };

  /* ---------- editor ---------- */
  let ei = -1, eImg = null, raf = 0;
  async function openEditor(i){
    ei = i;
    const p = photos[i];
    eImg = await loadImg(p.url);
    $('sBright').value = p.bright; $('sCon').value = p.contrast;
    $('vBright').textContent = p.bright; $('vCon').textContent = p.contrast;
    syncChips();
    $('sheet').style.display = 'flex';
    drawPreview();
  }
  function syncChips(){
    const p = photos[ei];
    document.querySelectorAll('#chips button').forEach(b => b.classList.toggle('sel', b.dataset.m === p.mode));
  }
  function drawPreview(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const p = photos[ei]; if (!p || !eImg) return;
      const c = processImg(p, eImg, 1000);
      $('prevImg').src = c.toDataURL('image/jpeg', 0.85);
      c.width = c.height = 0;
    });
  }
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    photos[ei].mode = b.dataset.m; syncChips(); drawPreview();
  });
  $('sBright').addEventListener('input', e => { photos[ei].bright = +e.target.value; $('vBright').textContent = e.target.value; drawPreview(); });
  $('sCon').addEventListener('input', e => { photos[ei].contrast = +e.target.value; $('vCon').textContent = e.target.value; drawPreview(); });
  $('eRot').onclick = () => { photos[ei].rot = (photos[ei].rot + 90) % 360; drawPreview(); };
  $('eDel').onclick = () => { photos.splice(ei, 1); closeEditor(false); };
  $('eDone').onclick = () => closeEditor(true);
  async function closeEditor(refresh){
    if (refresh && photos[ei]) await refreshThumb(photos[ei], eImg);
    $('sheet').style.display = 'none';
    eImg = null; ei = -1;
    render();
  }

  /* ---------- build PDF ---------- */
  $('make').onclick = async () => {
    if (!photos.length) return;
    const btn = $('make'); btn.disabled = true;
    try{
      const { jsPDF } = window.jspdf;
      const size = $('pageSize').value;
      const m = +$('margin').value;
      const q = +$('quality').value;
      let doc = null;

      for (let i = 0; i < photos.length; i++){
        btn.textContent = 'Page ' + (i + 1) + ' / ' + photos.length + '…';
        await new Promise(r => setTimeout(r, 30));
        const p = photos[i];
        const img = await loadImg(p.url);
        const c = processImg(p, img, EXPORT_MAX);
        const data = c.toDataURL('image/jpeg', q);
        const cw = c.width, ch = c.height;
        c.width = c.height = 0;
        const land = cw > ch;

        if (size === 'fit'){
          const s = Math.min(0.75, 1200 / Math.max(cw, ch));
          const w = cw * s, h = ch * s;
          if (!doc) doc = new jsPDF({unit: 'pt', format: [w, h], orientation: land ? 'l' : 'p', compress: true});
          else doc.addPage([w, h], land ? 'l' : 'p');
          doc.addImage(data, 'JPEG', 0, 0, w, h, undefined, 'FAST');
        } else {
          const o = land ? 'l' : 'p';
          if (!doc) doc = new jsPDF({unit: 'pt', format: size, orientation: o, compress: true});
          else doc.addPage(size, o);
          const pw = doc.internal.pageSize.getWidth();
          const ph = doc.internal.pageSize.getHeight();
          const s = Math.min((pw - m * 2) / cw, (ph - m * 2) / ch);
          const w = cw * s, h = ch * s;
          doc.addImage(data, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
        }
      }
      let name = ($('fname').value || '').trim().replace(/[^\w\- ]+/g, '');
      if (!name) name = 'photos-' + new Date().toISOString().slice(0, 10);
      doc.save(name + '.pdf');
      toast('PDF downloaded');
    }catch(e){
      console.error(e);
      toast('Failed: ' + e.message, 4000);
    }
    render();
  };

  render();
})();
</script>
</body>
</html>
