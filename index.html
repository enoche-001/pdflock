<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo to PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--txt:#eef0f4;--mut:#9aa1ae;--acc:#4f8cff;--ok:#22c55e;--bad:#ef4444}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 16px 120px}
  h1{font-size:20px;margin:4px 0 14px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  button,label.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;flex:1;text-align:center;min-width:130px}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.ok{background:var(--ok);border-color:var(--ok);color:#06210f}
  button:disabled{opacity:.45}
  input[type=file]{display:none}
  .opts{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:14px}
  select,input[type=text]{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
  input[type=text]{flex:1;min-width:140px}
  #camBox{display:none;margin:14px 0;background:#000;border-radius:14px;overflow:hidden;position:relative}
  #video{width:100%;max-height:60vh;display:block;object-fit:cover}
  .camBar{display:flex;gap:10px;padding:10px;background:var(--card)}
  .shutter{background:#fff!important;color:#000!important;flex:2}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
  .item img{width:100%;height:150px;object-fit:cover;display:block}
  .num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
  .tools{display:flex}
  .tools button{min-width:0;border:0;border-top:1px solid var(--line);border-radius:0;padding:9px 0;font-size:16px;background:transparent}
  .empty{color:var(--mut);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:14px;margin-top:10px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(15,17,21,.95);border-top:1px solid var(--line);display:flex;gap:10px}
  #msg{color:var(--mut);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<h1>📷 Photo → PDF</h1>

<div class="row">
  <button id="openCam" class="primary">Open Camera</button>
  <label class="btn" for="picker">Pick from Gallery</label>
  <input id="picker" type="file" accept="image/*" multiple>
  <label class="btn" for="nativeCam">Quick Snap</label>
  <input id="nativeCam" type="file" accept="image/*" capture="environment">
</div>

<div id="camBox">
  <video id="video" playsinline autoplay muted></video>
  <div class="camBar">
    <button id="flip">🔄 Flip</button>
    <button id="snap" class="shutter">● Capture</button>
    <button id="closeCam">Done</button>
  </div>
</div>

<div class="opts">
  <span>Page:</span>
  <select id="pageSize">
    <option value="a4">A4</option>
    <option value="letter">Letter</option>
    <option value="fit">Fit to image</option>
  </select>
  <span>Margin:</span>
  <select id="margin">
    <option value="0">None</option>
    <option value="20" selected>Small</option>
    <option value="40">Big</option>
  </select>
  <span>Quality:</span>
  <select id="quality">
    <option value="0.95">High</option>
    <option value="0.8" selected>Medium</option>
    <option value="0.6">Small file</option>
  </select>
  <input id="fname" type="text" placeholder="File name (optional)">
</div>

<div id="grid"></div>
<div id="empty" class="empty">No photos yet. Take or pick some.</div>
<div id="msg"></div>

<div class="bar">
  <button id="clear">Clear</button>
  <button id="make" class="ok" disabled>Download PDF</button>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let photos = []; // {id, url (dataURL), rot}
  let uid = 0, stream = null, facing = 'environment';

  const msg = t => $('msg').textContent = t || '';

  // ---------- read + shrink ----------
  function fileToImage(file){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
      img.src = url;
    });
  }
  function toDataURL(img, maxSide){
    let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const s = Math.min(1, maxSide / Math.max(w, h));
    w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.92);
  }
  async function addFiles(files){
    msg('Loading…');
    for (const f of files){
      try{
        const img = await fileToImage(f);
        photos.push({id: ++uid, url: toDataURL(img, 2200), rot: 0});
      }catch(e){ msg('Skipped a file that is not an image'); }
    }
    render(); if (photos.length) msg('');
  }

  $('picker').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value=''; });
  $('nativeCam').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value=''; });

  // ---------- in-page camera ----------
  async function startCam(){
    stopCam();
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: {facingMode: {ideal: facing}, width: {ideal: 1920}, height: {ideal: 1080}},
        audio: false
      });
      $('video').srcObject = stream;
      $('camBox').style.display = 'block';
    }catch(e){
      msg('Camera blocked or needs HTTPS. Use "Quick Snap" instead.');
    }
  }
  function stopCam(){
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
  $('openCam').onclick = startCam;
  $('closeCam').onclick = () => { stopCam(); $('camBox').style.display = 'none'; };
  $('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
  $('snap').onclick = () => {
    const v = $('video');
    if (!v.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    photos.push({id: ++uid, url: c.toDataURL('image/jpeg', 0.92), rot: 0});
    render();
    if (navigator.vibrate) navigator.vibrate(30);
    msg('Captured ' + photos.length + ' photo' + (photos.length > 1 ? 's' : ''));
  };

  // ---------- list ----------
  function render(){
    const g = $('grid');
    g.innerHTML = '';
    photos.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML =
        '<span class="num">' + (i+1) + '</span>' +
        '<img src="' + p.url + '" style="transform:rotate(' + p.rot + 'deg)">' +
        '<div class="tools">' +
        '<button data-a="l" data-i="' + i + '">◀</button>' +
        '<button data-a="r" data-i="' + i + '">⟳</button>' +
        '<button data-a="x" data-i="' + i + '">✕</button>' +
        '<button data-a="n" data-i="' + i + '">▶</button>' +
        '</div>';
      g.appendChild(d);
    });
    $('empty').style.display = photos.length ? 'none' : 'block';
    $('make').disabled = !photos.length;
    $('make').textContent = photos.length ? 'Download PDF (' + photos.length + ')' : 'Download PDF';
  }
  $('grid').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const i = +b.dataset.i, a = b.dataset.a;
    if (a === 'x') photos.splice(i, 1);
    else if (a === 'r') photos[i].rot = (photos[i].rot + 90) % 360;
    else if (a === 'l' && i > 0) [photos[i-1], photos[i]] = [photos[i], photos[i-1]];
    else if (a === 'n' && i < photos.length - 1) [photos[i+1], photos[i]] = [photos[i], photos[i+1]];
    render();
  });
  $('clear').onclick = () => { if (!photos.length || confirm('Remove all photos?')) { photos = []; render(); msg(''); } };

  // ---------- build PDF ----------
  function loadDataURL(u){
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; });
  }
  async function rotated(p, q){
    const img = await loadDataURL(p.url);
    const swap = p.rot === 90 || p.rot === 270;
    const c = document.createElement('canvas');
    c.width = swap ? img.height : img.width;
    c.height = swap ? img.width : img.height;
    const x = c.getContext('2d');
    x.translate(c.width/2, c.height/2);
    x.rotate(p.rot * Math.PI / 180);
    x.drawImage(img, -img.width/2, -img.height/2);
    return {data: c.toDataURL('image/jpeg', q), w: c.width, h: c.height};
  }
  $('make').onclick = async () => {
    if (!photos.length) return;
    const btn = $('make'); btn.disabled = true;
    try{
      const { jsPDF } = window.jspdf;
      const size = $('pageSize').value;
      const m = +$('margin').value;
      const q = +$('quality').value;
      let doc = null;

      for (let i = 0; i < photos.length; i++){
        msg('Building page ' + (i+1) + ' of ' + photos.length + '…');
        const r = await rotated(photos[i], q);
        const land = r.w > r.h;

        if (size === 'fit'){
          const w = r.w * 0.75, h = r.h * 0.75; // px -> pt
          if (!doc) doc = new jsPDF({unit:'pt', format:[w,h], orientation: land ? 'l' : 'p'});
          else doc.addPage([w,h], land ? 'l' : 'p');
          doc.addImage(r.data, 'JPEG', 0, 0, w, h);
        } else {
          const o = land ? 'l' : 'p';
          if (!doc) doc = new jsPDF({unit:'pt', format:size, orientation:o});
          else doc.addPage(size, o);
          const pw = doc.internal.pageSize.getWidth();
          const ph = doc.internal.pageSize.getHeight();
          const aw = pw - m*2, ah = ph - m*2;
          const s = Math.min(aw / r.w, ah / r.h);
          const w = r.w * s, h = r.h * s;
          doc.addImage(r.data, 'JPEG', (pw - w)/2, (ph - h)/2, w, h);
        }
        await new Promise(r => setTimeout(r, 0)); // keep UI alive
      }

      let name = ($('fname').value || '').trim().replace(/[^\w\- ]+/g, '');
      if (!name) name = 'photos-' + new Date().toISOString().slice(0,10);
      doc.save(name + '.pdf');
      msg('Done. PDF downloaded.');
    }catch(e){
      console.error(e);
      msg('Failed to make PDF: ' + e.message);
    }
    btn.disabled = !photos.length;
  };

  window.addEventListener('pagehide', stopCam);
  render();
})();
</script>
</body>
</html>
